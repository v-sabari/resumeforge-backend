name: Bug Report
description: Report a bug in the ResumeForge AI backend
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call endpoint '...'
        2. With payload '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      render: shell

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: e.g. local / staging / production, Java 21, Spring Boot 3.2.5

  - type: textarea
    id: additional
    attributes:
      label: Additional context
