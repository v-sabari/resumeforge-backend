name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build (skip tests)
        run: mvn -B clean package -DskipTests

      - name: Verify PDF fonts are bundled
        run: bash verify-jar-fonts.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resumeforge-ai-jar
          path: target/*.jar
          retention-days: 7
