spring.application.name=ResumeForge AI Backend
# ELASTIC BEANSTALK: EB routes traffic to port 5000 for Java platforms by
# default. Set the PORT environment variable to 5000 in the EB environment
# configuration (Configuration -> Software -> Environment properties).
server.port=${PORT:8080}

# Database
# SECURITY: No default values here on purpose. The app must fail fast at
# startup if these aren't supplied via environment variables, rather than
# silently falling back to a hardcoded connection string. See .env.example.
#
# MYSQL MIGRATION (was org.postgresql.Driver / jdbc:postgresql://...):
# spring.datasource.url must now be a MySQL JDBC URL, e.g.:
#   jdbc:mysql://<rds-endpoint>:3306/resumeforge?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# ISSUE-09 FIX: Changed from "validate" to "none".
# With Flyway managing schema, Hibernate validation is redundant and creates
# a startup race on slow/fresh DBs (Hibernate may validate before Flyway migrates).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# MYSQL MIGRATION: explicit dialect (Hibernate can usually auto-detect this
# from the driver, but being explicit avoids surprises across Hibernate versions).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false

# Logging
logging.level.root=WARN
logging.level.com.resumeforge=INFO
logging.level.org.springframework=WARN
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=WARN

# ISSUE-05 FIX: Removed the three DEBUG/TRACE lines that were left in from
# the RES-01 investigation. They logged PII-containing bind parameters in
# plaintext to Render's dashboard. To re-enable for a specific incident,
# set these Render environment variables without a redeploy:
#   LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
#   LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND=TRACE
#   LOGGING_LEVEL_COM_RESUMEFORGE_AI_SERVICE_RESUMESERVICE=DEBUG
# Unset them again once the incident is resolved.

# JWT
app.jwt-secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# OpenRouter / AI
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.base-url=https://openrouter.ai/api/v1/chat/completions
app.openrouter.model=openai/gpt-4o-mini
app.openrouter.site-url=${APP_SITE_URL:https://www.resumeforgeai.site}
app.openrouter.site-name=${APP_SITE_NAME:ResumeForge AI}
app.openrouter.connect-timeout-ms=${OPENROUTER_CONNECT_TIMEOUT_MS:10000}
app.openrouter.read-timeout-ms=${OPENROUTER_READ_TIMEOUT_MS:60000}
# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGIN:https://resumeforgeai.site,https://www.resumeforgeai.site}

# Frontend
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://www.resumeforgeai.site}

# Razorpay
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.payment-link=${RAZORPAY_PAYMENT_LINK:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
payment.amount=${PAYMENT_AMOUNT:74900}
payment.currency=${PAYMENT_CURRENCY:INR}

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=2

# Email
app.resend.api-key=${RESEND_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:support@resumeforgeai.site}
app.mail.from-name=${MAIL_FROM_NAME:ResumeForge AI}
app.contact.receiver-email=${CONTACT_RECEIVER_EMAIL:}

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never

# MYSQL MIGRATION NOTE: removed spring.jpa.properties.hibernate.default_schema=public,
# spring.flyway.schemas=public, and spring.datasource.hikari.schema=public.
# These assumed Postgres's "public" schema convention. In MySQL, the database
# itself IS the schema (already specified in spring.datasource.url), so these
# settings are unnecessary and would have pointed Hibernate/Flyway at a
# nonexistent "public" schema on your MySQL DB.

# Resume render endpoint (Vercel serverless function)
# This is now the FULL endpoint URL ? api/render-pdf.js living inside the
# FRONTEND repo/deployment, not a separate render-service. No path is
# appended in code; set this to the complete URL.
# Example: https://your-frontend.vercel.app/api/render-pdf
resume.render-service.url=${RENDER_SERVICE_URL:http://localhost:3000/api/render-pdf}
resume.render-service.timeout-seconds=${RENDER_SERVICE_TIMEOUT_SECONDS:20}
resume.render-service.internal-secret=${RENDER_INTERNAL_SECRET:}
